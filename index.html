<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>風控計算小幫手</title>
  <meta name="description" content="為您精確把關每一筆交易的風險：輸入本金、風控百分比、手數與合約規格，算出最大容忍波動與止損參考位。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>%25</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .field { width: 100%; border-width: 1px; border-radius: 0.75rem; padding: 0.75rem 1rem; outline: none; transition: all .15s; font-weight: 500; background: #fff; border-color: #e5e7eb; }
    .field:focus { border-color: #94a3b8; box-shadow: 0 0 0 2px rgba(100,116,139,.1); }
    .field.field-invalid { border-color: #f87171; background: #fef2f2; box-shadow: 0 0 0 2px rgba(248,113,113,.15); }
    .field:disabled, .field[readonly] { background: #f8fafc; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-900">
  <div class="max-w-5xl mx-auto">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 border-b border-slate-200 pb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-black text-slate-900 flex items-center gap-3 tracking-tight">
          <div class="bg-blue-600 p-2 rounded-xl shadow-lg">
            <i data-lucide="calculator" class="text-white w-7 h-7"></i>
          </div>
          風控計算小幫手
        </h1>
        <p class="text-slate-500 mt-2 font-medium flex items-center gap-2">為您精確把關每一筆交易的風險</p>
      </div>

      <div class="flex bg-slate-200/60 p-1.5 rounded-2xl border border-slate-200 overflow-x-auto">
        <button data-mode="indices" class="mode-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
          <i data-lucide="layers" class="w-3.5 h-3.5"></i>指數/能源
        </button>
        <button data-mode="metals" class="mode-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
          <i data-lucide="gem" class="w-3.5 h-3.5"></i>貴金屬
        </button>
        <button data-mode="forex" class="mode-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
          <i data-lucide="dollar-sign" class="w-3.5 h-3.5"></i>外匯
        </button>
        <button data-mode="crypto" class="mode-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
          <i data-lucide="coins" class="w-3.5 h-3.5"></i>加密貨幣
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- 左側：輸入 -->
      <div class="lg:col-span-7 space-y-4">
        <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-200/60">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8">
            <div class="mb-5">
              <label for="commodity" class="text-sm font-semibold flex items-center gap-2 text-blue-600 mb-1.5">
                <i data-lucide="search" class="w-4 h-4"></i>商品符號 (Symbol)
              </label>
              <input id="commodity" type="text" value="HK50" placeholder="如: HK50, XAUUSD, ETH" autocomplete="off" autocapitalize="characters" spellcheck="false"
                class="w-full border rounded-xl py-3 px-4 outline-none transition-all font-medium bg-blue-50 border-blue-200 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" />
              <p id="symbolNote" class="text-[11px] mt-1.5 font-semibold text-emerald-600 min-h-[1rem]"></p>
            </div>
            <div class="mb-5">
              <label for="currentPrice" class="text-sm font-semibold flex items-center gap-2 text-gray-700 mb-1.5">
                <i data-lucide="target" class="w-4 h-4"></i>當前市價
              </label>
              <input id="currentPrice" type="number" inputmode="decimal" placeholder="輸入目前點位" class="field" />
            </div>
          </div>

          <div class="h-px bg-slate-100 my-4 mb-8"></div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8">
            <div class="mb-5">
              <label for="capital" class="text-sm font-semibold flex items-center gap-2 text-gray-700 mb-1.5">
                <i data-lucide="dollar-sign" class="w-4 h-4"></i>本金 (Balance)
              </label>
              <div class="relative">
                <input id="capital" type="number" inputmode="decimal" placeholder="帳戶餘額" class="field pr-14" />
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-medium">USD</span>
              </div>
            </div>
            <div class="mb-5">
              <label for="riskPercent" class="text-sm font-semibold flex items-center gap-2 text-gray-700 mb-1.5">
                <i data-lucide="percent" class="w-4 h-4"></i>風控百分比
              </label>
              <div class="relative">
                <input id="riskPercent" type="number" inputmode="decimal" placeholder="預計損失 %" class="field pr-10" />
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-medium">%</span>
              </div>
            </div>
            <div class="mb-5">
              <label for="lots" class="text-sm font-semibold flex items-center gap-2 text-gray-700 mb-1.5">
                <i data-lucide="activity" class="w-4 h-4"></i>交易手數 (Lots)
              </label>
              <input id="lots" type="number" inputmode="decimal" placeholder="下單手數" class="field" />
            </div>
            <div class="mb-5">
              <div class="flex items-center justify-between mb-1.5">
                <label for="contractSize" class="text-sm font-semibold flex items-center gap-2 text-gray-700">
                  <i data-lucide="layers" class="w-4 h-4"></i>合約規格 (Size)
                </label>
                <div class="group relative">
                  <i data-lucide="info" class="w-3.5 h-3.5 text-gray-400 cursor-help"></i>
                  <div class="absolute bottom-full right-0 mb-2 w-64 p-3 bg-gray-900 text-white text-xs rounded-xl shadow-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-20 border border-gray-700 leading-relaxed">
                    1手代表的數量。例如 ETH=10, HK50=50。
                  </div>
                </div>
              </div>
              <input id="contractSize" type="number" inputmode="decimal" value="50" placeholder="請輸入合約規格" class="field" />
            </div>
            <div class="mb-5">
              <div class="flex items-center justify-between mb-1.5">
                <label for="quoteCcy" class="text-sm font-semibold flex items-center gap-2 text-gray-700">
                  <i data-lucide="banknote" class="w-4 h-4"></i>計價貨幣
                </label>
                <div class="group relative">
                  <i data-lucide="info" class="w-3.5 h-3.5 text-gray-400 cursor-help"></i>
                  <div class="absolute bottom-full right-0 mb-2 w-64 p-3 bg-gray-900 text-white text-xs rounded-xl shadow-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-20 border border-gray-700 leading-relaxed">
                    商品報價的貨幣。例如 USDJPY、JP225 以日圓計價，HK50 以港幣計價。非美元計價會自動換算成美元。
                  </div>
                </div>
              </div>
              <select id="quoteCcy" class="field appearance-none"></select>
            </div>
            <div class="mb-5">
              <label for="rate" class="text-sm font-semibold flex items-center gap-2 text-gray-700 mb-1.5">
                <i data-lucide="arrow-left-right" class="w-4 h-4"></i>匯率換算
                <span id="rateLabel" class="text-gray-400 font-medium text-xs"></span>
              </label>
              <div class="relative">
                <input id="rate" type="number" inputmode="decimal" placeholder="輸入匯率" class="field pr-14" />
                <span id="rateUnit" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-medium"></span>
              </div>
              <p id="rateNote" class="text-[11px] mt-1.5 text-slate-400 min-h-[1rem]"></p>
            </div>
          </div>
        </div>

        <!-- 動態提醒 -->
        <div id="warnings" class="space-y-2"></div>

        <!-- 優化告知區塊 -->
        <div class="bg-amber-50 rounded-xl p-4 border border-amber-100 flex items-center gap-3">
          <i data-lucide="circle-alert" class="w-5 h-5 text-amber-500 shrink-0"></i>
          <p class="text-xs text-amber-800 font-medium italic">合約數量如果有誤，請告知小幫手優化</p>
        </div>
      </div>

      <!-- 右側：結果 -->
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden border border-white/5">
          <div class="relative z-10">
            <div class="flex justify-between items-start mb-8">
              <h3 class="text-slate-500 text-xs font-black uppercase tracking-[0.2em]">Risk Analysis</h3>
              <span class="bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full text-[10px] border border-blue-500/20 font-bold uppercase">
                SIZE: <span id="sizeBadge">50</span>
              </span>
            </div>

            <div class="space-y-10">
              <div>
                <div class="text-slate-400 text-xs mb-2 flex items-center justify-between font-bold">
                  <span class="flex items-center gap-1.5"><i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-emerald-400"></i> 最大容忍波動</span>
                  <span id="volPercent" class="text-emerald-400 bg-emerald-400/10 px-3 py-0.5 rounded-full border border-emerald-400/20 font-mono">0.00%</span>
                </div>
                <div class="text-4xl md:text-5xl font-black text-white tracking-tighter break-all">
                  ± <span id="allowedVolatility">0.00</span>
                  <span id="volUnit" class="text-xl ml-1 font-medium text-slate-500 italic">pts</span>
                </div>
                <div id="volSub" class="text-xs text-slate-400 font-mono mt-1 hidden"></div>
                <div class="flex items-center gap-2 mt-4 text-xs text-slate-300 font-semibold bg-white/5 w-fit px-3 py-1.5 rounded-lg border border-white/5">
                  <i data-lucide="trending-up" class="w-3.5 h-3.5 text-blue-400"></i>
                  <span id="ppvLabel">每 1 點價值</span>: <span id="dollarPerPoint" class="text-white font-mono">$0.00</span>
                </div>
              </div>

              <div class="p-5 bg-white/5 rounded-3xl border border-white/5 backdrop-blur-sm">
                <div class="text-slate-500 text-[10px] mb-5 font-black tracking-widest uppercase italic">止損參考 (Stop Loss)</div>
                <div class="flex flex-col gap-5">
                  <div class="flex justify-between items-center gap-3">
                    <span class="text-slate-400 text-xs font-bold whitespace-nowrap">空單止損位</span>
                    <span id="rangeHigh" class="text-base font-mono text-red-400 font-black bg-red-400/10 px-3 py-1 rounded-xl border border-red-400/10">--</span>
                  </div>
                  <div class="h-px bg-slate-800 w-full relative">
                    <div class="absolute left-1/2 -top-2.5 -translate-x-1/2 bg-slate-900 px-3 text-[10px] text-slate-500 font-bold whitespace-nowrap">
                      現價 <span id="priceLabel">0.00</span>
                    </div>
                  </div>
                  <div class="flex justify-between items-center gap-3">
                    <span class="text-slate-400 text-xs font-bold whitespace-nowrap">多單止損位</span>
                    <span id="rangeLow" class="text-base font-mono text-emerald-400 font-black bg-emerald-400/10 px-3 py-1 rounded-xl border border-emerald-400/10">--</span>
                  </div>
                </div>
              </div>

              <div class="pt-6 border-t border-white/5 flex justify-between items-end">
                <div class="flex flex-col">
                  <span class="text-slate-500 text-[10px] font-black uppercase tracking-widest">預計總虧損</span>
                  <span id="riskAmount" class="text-3xl font-black text-red-500 mt-1">$0.00</span>
                </div>
              </div>
            </div>
          </div>
          <div class="absolute -right-16 -top-16 w-64 h-64 bg-blue-600/10 rounded-full blur-[80px]"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // 商品資料庫
    // size: 1 手的合約規格（null = 已辨識但尚未設定，需手動輸入）
    // ccy: 計價貨幣　digits: 價格小數位　aliases: 其他常見代號
    // ============================================================
    const P = (id, name, mode, size, ccy, digits, aliases = []) => ({ id, name, mode, size, ccy, digits, aliases });
    const PRODUCTS = [
      // --- 指數 ---
      P('US30', '道瓊指數', 'indices', 1, 'USD', 2, ['DJI', 'DJ30', 'WS30', 'DOW', 'DJIA', 'US30CASH', 'YM']),
      P('NAS100', '那斯達克 100', 'indices', 1, 'USD', 2, ['US100', 'USTEC', 'USTECH', 'NDX', 'NAS', 'NQ', 'US100CASH', 'NAS100CASH']),
      P('US500', '標普 500', 'indices', 1, 'USD', 2, ['SPX', 'SPX500', 'SP500', 'US500CASH', 'ES']),
      P('HK50', '恒生指數', 'indices', 50, 'HKD', 2, ['HSI', 'HK50CASH', 'HKG50']),
      P('GER40', '德國 DAX', 'indices', 25, 'EUR', 2, ['DE40', 'DAX', 'DAX40', 'GER30', 'DE30', 'GER40CASH']),
      P('JP225', '日經 225', 'indices', 100, 'JPY', 2, ['JPN225', 'NIKKEI', 'NI225', 'NIK225', 'JP225CASH']),
      P('TW50', '台灣指數', 'indices', 1, 'USD', 2, ['TAIEX']),
      P('UK100', '英國富時 100', 'indices', 1, 'GBP', 2, ['FTSE', 'FTSE100', 'UK100CASH']),
      P('AUS200', '澳洲 ASX 200', 'indices', 1, 'AUD', 2, ['AU200', 'ASX200', 'AUS200CASH']),
      P('FRA40', '法國 CAC 40', 'indices', 1, 'EUR', 2, ['FR40', 'CAC40', 'CAC']),
      P('EU50', '歐洲斯托克 50', 'indices', 1, 'EUR', 2, ['EUSTX50', 'STOXX50', 'EUSTOXX50', 'EU50CASH']),
      P('CHINA50', '富時中國 A50', 'indices', 1, 'USD', 2, ['CN50', 'CHINAA50', 'A50']),
      // --- 能源（顯示在「指數/能源」分頁）---
      P('USOIL', 'WTI 原油', 'indices', 1000, 'USD', 2, ['WTI', 'OIL', 'XTIUSD', 'USOUSD', 'CL', 'CRUDE', 'USCRUDE', 'OILCASH']),
      P('UKOIL', '布蘭特原油', 'indices', 1000, 'USD', 2, ['BRENT', 'XBRUSD', 'UKOUSD', 'BRENTCASH']),
      P('NGAS', '天然氣', 'indices', 10000, 'USD', 3, ['NATGAS', 'XNGUSD', 'NG']),
      // --- 貴金屬 ---
      P('XAUUSD', '黃金', 'metals', 100, 'USD', 2, ['GOLD', 'XAU']),
      P('XAGUSD', '白銀', 'metals', 5000, 'USD', 3, ['SILVER', 'XAG'])
    ];

    // 加密貨幣（輸入 BTC、BTCUSD、BTCUSDT 都會辨識）
    const CRYPTO = {
      // 規格參考主流 MT5 券商（IC Markets 等）；ETH 依原版設定為 10
      BTC: { name: '比特幣', size: 1, digits: 2 },
      ETH: { name: '以太幣', size: 10, digits: 2 },
      SOL: { name: 'Solana', size: 1, digits: 2 },
      XRP: { name: 'XRP', size: 1, digits: 4 },
      DOGE: { name: '狗狗幣', size: 100, digits: 5 },
      ADA: { name: 'Cardano', size: 10, digits: 4 },
      LTC: { name: '萊特幣', size: 1, digits: 2 },
      BNB: { name: 'BNB', size: 1, digits: 2 },
      DOT: { name: 'Polkadot', size: 1, digits: 3 },
      LINK: { name: 'Chainlink', size: 1, digits: 3 },
      AVAX: { name: 'Avalanche', size: 1, digits: 2 },
      BCH: { name: '比特幣現金', size: 1, digits: 2 },
      TRX: { name: '波場', size: 1000, digits: 5 }
    };

    // 外匯：任兩個以下貨幣組成的 6 碼代號都會辨識為貨幣對，1 手 = 100,000
    const CURRENCIES = ['USD', 'EUR', 'GBP', 'JPY', 'AUD', 'NZD', 'CAD', 'CHF', 'HKD', 'SGD', 'CNH', 'TWD',
      'SEK', 'NOK', 'DKK', 'MXN', 'ZAR', 'TRY', 'PLN', 'HUF', 'CZK', 'THB'];
    const FOREX_SIZE = 100000;

    // 券商常見後綴（例如 XAUUSD.m、EURUSDm、US30.cash）
    const SUFFIXES = ['CASH', 'MICRO', 'MINI', 'PRO', 'ECN', 'RAW', 'STD', 'VIP', 'SB', 'M', 'C', 'I', 'E', 'R', 'X', 'Z', 'B'];

    // 分頁切換時帶入的預設商品
    const MODE_DEFAULTS = { indices: 'HK50', metals: 'XAUUSD', forex: 'EURUSD', crypto: 'BTCUSD' };
    const MODE_LABEL = { indices: '指數/能源', metals: '貴金屬', forex: '外匯', crypto: '加密貨幣' };

    const ALIAS = {};
    PRODUCTS.forEach((p) => [p.id, ...p.aliases].forEach((a) => (ALIAS[a] = p)));

    function resolveCore(s) {
      if (!s) return null;
      if (ALIAS[s]) return ALIAS[s];
      let m = s.match(/^([A-Z]+?)(USD|USDT|USDC)?$/);
      const CRYPTO_ALIAS = { DOG: 'DOGE', LNK: 'LINK' };
      if (m && CRYPTO_ALIAS[m[1]]) m[1] = CRYPTO_ALIAS[m[1]];
      if (m && CRYPTO[m[1]]) {
        const c = CRYPTO[m[1]];
        return { id: m[1] + 'USD', name: c.name, mode: 'crypto', size: c.size, ccy: 'USD', digits: c.digits };
      }
      m = s.match(/^(XAU|XAG)([A-Z]{3})$/);
      if (m && CURRENCIES.includes(m[2])) {
        const base = ALIAS[m[1]];
        return { ...base, id: s, name: `${base.name}（${m[2]} 計價）`, ccy: m[2] };
      }
      m = s.match(/^([A-Z]{3})([A-Z]{3})$/);
      if (m && m[1] !== m[2] && CURRENCIES.includes(m[1]) && CURRENCIES.includes(m[2])) {
        return { id: s, name: `${m[1]}/${m[2]}`, mode: 'forex', size: FOREX_SIZE, ccy: m[2], base: m[1], digits: m[2] === 'JPY' ? 3 : 5 };
      }
      return null;
    }

    function resolveSymbol(raw) {
      let s = String(raw || '').toUpperCase();
      if (s.includes(':')) s = s.split(':').pop();      // OANDA:XAUUSD
      s = s.replace(/[^A-Z0-9]/g, '');
      const hit = resolveCore(s);
      if (hit) return hit;
      for (const suf of SUFFIXES) {
        if (s.length > suf.length + 2 && s.endsWith(suf)) {
          const r = resolveCore(s.slice(0, -suf.length));
          if (r) return r;
        }
      }
      return null;
    }

    // ============================================================
    // 匯率：自動抓取「1 USD = ? 外幣」，失敗時可手動輸入
    // ============================================================
    let rates = null, ratesDate = '', ratesSource = '', ratesFailed = false, rateManual = false;

    async function loadRates() {
      const sources = [
        async () => {
          const j = await (await fetch('https://open.er-api.com/v6/latest/USD')).json();
          if (j.result !== 'success') throw new Error('bad');
          return { rates: j.rates, date: (j.time_last_update_utc || '').slice(5, 16), src: 'ExchangeRate-API' };
        },
        async () => {
          const j = await (await fetch('https://api.frankfurter.app/latest?from=USD')).json();
          if (!j.rates) throw new Error('bad');
          return { rates: { ...j.rates, USD: 1 }, date: j.date, src: 'Frankfurter' };
        }
      ];
      for (const load of sources) {
        try {
          const r = await load();
          rates = r.rates; ratesDate = r.date; ratesSource = r.src;
          calculate();
          return;
        } catch (e) { /* 換下一個來源 */ }
      }
      ratesFailed = true;
      calculate();
    }

    function fetchedRate(ccy) {
      if (!rates) return 0;
      return rates[ccy] || (ccy === 'CNH' ? rates.CNY : 0) || 0;
    }

    // ============================================================
    // 畫面
    // ============================================================
    const $ = (id) => document.getElementById(id);
    const el = {
      commodity: $('commodity'), currentPrice: $('currentPrice'), capital: $('capital'), riskPercent: $('riskPercent'),
      lots: $('lots'), contractSize: $('contractSize'), quoteCcy: $('quoteCcy'), rate: $('rate')
    };
    let mode = 'indices';
    let current = null;          // 目前辨識到的商品
    let symbolPending = false;   // 使用者還在打字，先不顯示「認不出」
    let symbolTimer = null;

    CURRENCIES.forEach((c) => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c === 'USD' ? 'USD（美元）' : c;
      el.quoteCcy.appendChild(o);
    });

    const ACTIVE = ['bg-white', 'text-blue-600', 'shadow-md', 'ring-1', 'ring-black/5'];
    const INACTIVE = ['text-slate-500', 'hover:bg-slate-300/50', 'hover:text-slate-700'];
    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        const on = btn.dataset.mode === mode;
        btn.classList.remove(...ACTIVE, ...INACTIVE);
        btn.classList.add(...(on ? ACTIVE : INACTIVE));
      });
    }

    function applySymbol() {
      current = resolveSymbol(el.commodity.value);
      if (current) {
        setMode(current.mode);
        el.contractSize.value = current.size != null ? current.size : '';
        el.quoteCcy.value = current.ccy;
        rateManual = false;
      }
      calculate();
    }

    function handleCommodityInput() {
      symbolPending = true;
      clearTimeout(symbolTimer);
      symbolTimer = setTimeout(() => { symbolPending = false; calculate(); }, 700);
      applySymbol();
    }

    function handleModeChange(newMode) {
      el.commodity.value = MODE_DEFAULTS[newMode];
      symbolPending = false;
      applySymbol();
      setMode(newMode);
      calculate();
    }

    const decimalsOf = (str) => ((String(str).split('.')[1] || '').length);
    const fmt = (n, d) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
    const money = (n) => {
      if (!n) return '$0.00';
      if (Math.abs(n) < 1) return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
      return '$' + fmt(n, 2);
    };

    // 回傳「1 USD = ? 計價貨幣」以及來源說明
    function updateRateUI(price) {
      const ccy = el.quoteCcy.value;
      const label = $('rateLabel'), unit = $('rateUnit'), note = $('rateNote');
      unit.textContent = ccy;
      label.textContent = `（1 USD = ? ${ccy}）`;
      note.className = 'text-[11px] mt-1.5 text-slate-400 min-h-[1rem]';

      if (ccy === 'USD') {
        el.rate.value = 1; el.rate.disabled = true; el.rate.readOnly = false;
        note.textContent = '美元計價，免換算';
        return { value: 1, kind: 'usd' };
      }
      el.rate.disabled = false;

      // USDJPY、USDCAD、USDCHF…：用當前市價直接換算，最準確
      if (current && current.mode === 'forex' && current.base === 'USD' && current.ccy === ccy) {
        el.rate.readOnly = true;
        el.rate.value = price > 0 ? price : '';
        note.textContent = price > 0 ? `依當前市價自動換算（${current.id}）` : '輸入當前市價後自動換算';
        return { value: price, kind: price > 0 ? 'price' : 'price-missing' };
      }

      el.rate.readOnly = false;
      if (rateManual) {
        note.textContent = '手動輸入';
        return { value: num('rate'), kind: 'manual' };
      }
      const r = fetchedRate(ccy);
      if (r) {
        el.rate.value = +r.toPrecision(6);
        note.textContent = `自動帶入參考匯率（${ratesDate}，${ratesSource}）· 可手動修改`;
        return { value: +r.toPrecision(6), kind: 'auto' };
      }
      el.rate.value = '';
      if (ratesFailed) {
        note.textContent = '無法自動取得匯率，請手動輸入';
        note.className = 'text-[11px] mt-1.5 text-amber-600 font-semibold min-h-[1rem]';
        return { value: 0, kind: 'missing' };
      }
      note.textContent = '匯率載入中…';
      return { value: 0, kind: 'loading' };
    }

    function renderWarnings(list) {
      const box = $('warnings');
      box.innerHTML = '';
      list.forEach(({ level, text }) => {
        const div = document.createElement('div');
        const red = level === 'error';
        div.className = `rounded-xl p-4 border flex items-start gap-3 text-xs font-semibold ${red ? 'bg-red-50 border-red-100 text-red-700' : 'bg-orange-50 border-orange-100 text-orange-800'}`;
        const icon = document.createElement('i');
        icon.setAttribute('data-lucide', red ? 'octagon-alert' : 'triangle-alert');
        icon.className = `w-4 h-4 shrink-0 mt-px ${red ? 'text-red-500' : 'text-orange-500'}`;
        const p = document.createElement('p');
        p.textContent = text;
        div.append(icon, p);
        box.appendChild(div);
      });
      if (window.lucide) lucide.createIcons();
    }

    // 核心計算邏輯
    function calculate() {
      const cap = num('capital');
      const risk = num('riskPercent');
      const lot = num('lots');
      const size = num('contractSize');
      const price = num('currentPrice');
      const priceStr = price > 0 ? el.currentPrice.value : '';
      const ccy = el.quoteCcy.value;
      const isFx = mode === 'forex';
      const pipSize = ccy === 'JPY' ? 0.01 : 0.0001;

      const rate = updateRateUI(price);
      const usdPerQuote = rate.value > 0 ? 1 / rate.value : 0;

      // 風險總額 = 本金 × 風控%
      const riskAmount = cap * (risk / 100);
      // 每 1 點（價格變動 1）價值，換算成美元
      const pointVal = lot > 0 && size > 0 ? lot * size * usdPerQuote : 0;
      // 容忍波動 = 風險總額 ÷ 每點價值
      const vol = pointVal > 0 ? riskAmount / pointVal : 0;
      const volPercent = price > 0 && vol > 0 ? (vol / price) * 100 : 0;
      const digits = Math.min(8, Math.max(current ? current.digits : 2, decimalsOf(priceStr)));
      const high = price + vol, low = price - vol;
      const hasRange = price > 0 && vol > 0;

      $('sizeBadge').textContent = `${el.contractSize.value || '--'} · ${ccy}`;
      $('volPercent').textContent = volPercent.toFixed(2) + '%';
      if (isFx) {
        $('allowedVolatility').textContent = fmt(vol / pipSize, 1);
        $('volUnit').textContent = 'pips';
        $('volSub').textContent = `價格距離 ± ${fmt(vol, digits)}`;
        $('volSub').classList.toggle('hidden', !vol);
        $('ppvLabel').textContent = '每 1 pip 價值';
        $('dollarPerPoint').textContent = money(pointVal * pipSize);
      } else {
        $('allowedVolatility').textContent = fmt(vol, digits);
        $('volUnit').textContent = 'pts';
        $('volSub').classList.add('hidden');
        $('ppvLabel').textContent = '每 1 點價值';
        $('dollarPerPoint').textContent = money(pointVal);
      }
      $('rangeHigh').textContent = hasRange ? fmt(high, digits) : '--';
      $('rangeLow').textContent = hasRange && low > 0 ? fmt(low, digits) : '--';
      $('priceLabel').textContent = priceStr || '0.00';
      $('riskAmount').textContent = '$' + fmt(riskAmount, 2);

      // 商品辨識結果
      const sym = el.commodity.value.trim();
      $('symbolNote').textContent = current ? `✓ ${current.name} · ${MODE_LABEL[current.mode]} · ${current.ccy} 計價` : '';

      // 提醒
      const warns = [];
      if (sym && !current && !symbolPending) {
        warns.push({ level: 'warn', text: `認不出「${sym}」這個代號，合約規格與計價貨幣沿用目前設定（${el.contractSize.value || '未填'}、${ccy}），請自行確認是否正確` });
      }
      if (current && current.size == null && !size) {
        warns.push({ level: 'warn', text: `已辨識為 ${current.name}，但小幫手還沒有這個商品的合約規格，請手動輸入「合約規格」` });
      }
      if (rate.kind === 'price-missing' && (lot || cap)) {
        warns.push({ level: 'warn', text: `${current.id} 以 ${ccy} 計價，需要輸入當前市價才能換算成美元` });
      }
      if (rate.kind === 'missing') {
        warns.push({ level: 'warn', text: `無法自動取得 ${ccy} 匯率，請在「匯率換算」手動輸入 1 USD 可換多少 ${ccy}` });
      }
      if (hasRange && low <= 0) {
        warns.push({ level: 'error', text: '容忍波動已超過現價，多單止損位不存在，請檢查手數或合約規格是否正確' });
      }
      renderWarnings(warns);
      showFieldErrors();
    }

    // ============================================================
    // 輸入檢查：不接受負數與 0，風控百分比不可超過 100
    // ============================================================
    const FIELD_RULES = {
      currentPrice: { label: '當前市價' }, capital: { label: '本金' }, riskPercent: { label: '風控百分比', max: 100 },
      lots: { label: '交易手數' }, contractSize: { label: '合約規格' }, rate: { label: '匯率' }
    };
    function checkField(id) {
      const raw = String(el[id].value).trim();
      if (raw === '') return { ok: true, n: 0, msg: '' };
      const n = Number(raw);
      const rule = FIELD_RULES[id];
      if (!Number.isFinite(n)) return { ok: false, n: 0, msg: '請輸入數字' };
      if (n <= 0) return { ok: false, n: 0, msg: `${rule.label}必須大於 0` };
      if (rule.max && n > rule.max) return { ok: false, n: 0, msg: `${rule.label}不可超過 ${rule.max}%` };
      return { ok: true, n, msg: '' };
    }
    const num = (id) => checkField(id).n;
    const errEls = {};
    Object.keys(FIELD_RULES).forEach((id) => {
      const p = document.createElement('p');
      p.className = 'text-[11px] mt-1.5 text-red-600 font-semibold hidden';
      el[id].closest('.mb-5').appendChild(p);
      errEls[id] = p;
      el[id].min = '0';
      // 直接擋掉負號與科學記號
      el[id].addEventListener('keydown', (e) => { if (['-', '+', 'e', 'E'].includes(e.key)) e.preventDefault(); });
    });
    function showFieldErrors() {
      Object.keys(FIELD_RULES).forEach((id) => {
        const locked = el[id].disabled || el[id].readOnly;
        const r = locked ? { ok: true, msg: '' } : checkField(id);
        el[id].classList.toggle('field-invalid', !r.ok);
        errEls[id].textContent = r.msg;
        errEls[id].classList.toggle('hidden', r.ok);
      });
    }

    // 綁定事件
    document.querySelectorAll('.mode-btn').forEach((btn) =>
      btn.addEventListener('click', () => handleModeChange(btn.dataset.mode))
    );
    el.commodity.addEventListener('input', handleCommodityInput);
    el.commodity.addEventListener('blur', () => { symbolPending = false; calculate(); });
    ['currentPrice', 'capital', 'riskPercent', 'lots', 'contractSize'].forEach((k) =>
      el[k].addEventListener('input', calculate)
    );
    el.quoteCcy.addEventListener('change', () => { rateManual = false; calculate(); });
    el.rate.addEventListener('input', () => { rateManual = true; calculate(); });

    applySymbol();
    if (window.lucide) lucide.createIcons();
    loadRates();
  </script>
</body>
</html>
